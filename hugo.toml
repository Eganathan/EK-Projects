baseURL = "https://projects.eknath.dev"
languageCode = "en-us"
title = "Projects"
theme = "projectgrid"

[params]
  description = "My projects and experiments"
  author = "Eganathan R (Eknath)"
  siteid = "projects"
  repository = "projects_blog"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "RECENT"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = -1

[outputFormats.RECENT]
  mediaType = "application/json"
  baseName = "recent"
  isPlainText = true
  notAlternative = true
